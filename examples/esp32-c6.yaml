esphome:
  name: <device name>
  friendly_name: <friendly name>
  min_version: 2025.6.0

esp32:
  board: esp32-c6-devkitc-1
  framework:
    # ESP32-C6 requires the ESP-IDF framework; the Arduino framework is
    # not supported by ESPHome for this chip.
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

ota:
  - platform: esphome
    password: <pass here>

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: <hotspot name>
    password: <hotspot pass>

captive_portal:

api:
  encryption:
    key: <your key here>

external_components:
  - source: github://ginkage/MHI-AC-Ctrl-ESPHome@master
    components: [MhiAcCtrl]

# Version 4.0
MhiAcCtrl:
  # Only 20 (legacy) or 33 (includes 3D auto and vertical vanes) possible.
  # If you encounter mhi_ac_ctrl_core.loop error: -2 errors, change the frame_size to 20
  frame_size: 33
  # GPIO pins for the MHI P1/P2 bus (defaults shown).
  # On the ESP32-C6 avoid strapping pins GPIO4, GPIO5, GPIO8 and GPIO9.
  # sck_pin: 14
  # mosi_pin: 13
  # miso_pin: 12

climate:
  - platform: MhiAcCtrl
    name: "MHI Air Conditioner"

select:
  - platform: MhiAcCtrl
    vertical_vanes:
      name: Fan Control Up Down
    horizontal_vanes:
      name: Fan Control Left Right

switch:
  - platform: MhiAcCtrl
    vanes_3d_auto:
      name: "3D Auto"
sensor:
  - platform: MhiAcCtrl
    outdoor_temperature:
      name: "Outdoor temperature"
